{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav" aria-label="Primary navigation">
        <button class="greedy-nav__toggle" type="button" aria-label="Show navigation menu" aria-controls="site-nav-menu" aria-expanded="false"><span class="navicon"></span></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist {% if page.url == '/' or page.url == '/index.html' %}selected{% endif %}">
            <a class="site-brand" href="{{ base_path }}/"><span class="site-brand__initials" aria-hidden="true">JP</span><span class="site-brand__name">{{ site.title }}</span></a>
          </li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item {% if page.url contains link.url and link.url != '/' %}selected{% endif %}">
              <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>
            </li>
          {% endfor %}
        </ul>
        <ul id="site-nav-menu" class="hidden-links hidden"></ul>
      </nav>
      <button id="theme-toggle" class="site-theme-toggle" type="button" aria-label="Toggle color theme" title="Toggle color theme">
        <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
